<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bethive - Live Betting Platform</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-yellow: #f39c12;
      --accent-red: #e74c3c;
      --text-main: #ffffff;
      --text-muted: #b0b0b0;
      --border-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: var(--accent-yellow);
      letter-spacing: 1px;
    }

    .user-panel {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .balance-box {
      background: #2c2c2c;
      padding: 6px 12px;
      border-radius: 4px;
      color: var(--accent-yellow);
      font-weight: bold;
    }

    .btn {
      background: var(--accent-yellow);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .btn-danger {
      background: var(--accent-red);
      color: #fff;
    }

    /* Main App Layout */
    .app-container {
      display: grid;
      grid-template-columns: 240px 1fr 300px;
      gap: 20px;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    aside, section {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 15px;
      height: fit-content;
    }

    h3 {
      margin-bottom: 15px;
      font-size: 16px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      color: var(--text-muted);
    }

    .nav-links, .wallet-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .nav-link {
      background: transparent;
      color: var(--text-main);
      border: none;
      text-align: left;
      padding: 8px;
      cursor: pointer;
      border-radius: 4px;
    }

    .nav-link:hover {
      background: #2a2a2a;
      color: var(--accent-yellow);
    }

    input {
      width: 100%;
      padding: 8px;
      background: #2a2a2a;
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    /* Match Container Styling */
    .match-card {
      background: #252525;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .match-teams {
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .odds-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .odd-btn {
      background: #333;
      border: 1px solid #444;
      color: #fff;
      padding: 6px;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      font-size: 12px;
    }

    .odd-btn:hover, .odd-btn.selected {
      background: var(--accent-yellow);
      color: #000;
      border-color: var(--accent-yellow);
    }

    /* Bet Slip */
    .bet-slip-content {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      padding: 20px 0;
    }

    /* ========================================== */
    /* MOBILE RESPONSIVE MEDIA QUERY FIX         */
    /* ========================================== */
    @media screen and (max-width: 900px) {
      .app-container {
        display: flex;
        flex-direction: column;
        padding: 10px;
        gap: 10px;
      }

      aside, section {
        width: 100%;
      }

      header {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }

      .user-panel {
        justify-content: center;
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">BETHIVE</div>
    <div class="user-panel" id="userPanel">
      <span id="welcomeMsg">Welcome Guest</span>
      <div class="balance-box" id="balanceBox">₦0.00</div>
      <button class="btn btn-danger" id="authBtn" onclick="handleAuthAction()">Login</button>
    </div>
  </header>

  <div class="app-container">
    <aside>
      <h3>NAVIGATION</h3>
      <div class="nav-links">
        <button class="nav-link">⚽ Football Matches</button>
        <button class="nav-link">🎮 Virtual Sports</button>
      </div>

      <h3>WALLET ACTIONS</h3>
      <div class="wallet-actions">
        <input type="number" id="walletAmount" placeholder="Amount (₦)">
        <button class="btn" onclick="handleDeposit()">Quick Deposit</button>
        <button class="btn btn-danger" onclick="handleWithdraw()">Withdraw Funds</button>
      </div>
    </aside>

    <section id="matchesSection">
      <h3>UPCOMING MATCHES (FULL MARKETS)</h3>
      <div id="matchesList">
        <p style="text-align: center; color: var(--text-muted); padding: 20px;">Loading live matches...</p>
      </div>
    </section>

    <aside>
      <h3>BET SLIP (<span id="slipCount">0</span>)</h3>
      <div class="bet-slip-content" id="betSlipBox">
        Your bet slip is empty.<br>Click odds to add selections.
      </div>
      <div style="margin-top: 15px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 13px;">
          <span>Total Odds:</span>
          <span id="totalOdds" style="color: var(--accent-yellow); font-weight: bold;">1.00</span>
        </div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px;">
          <span>Potential Payout:</span>
          <span id="potentialPayout" style="color: var(--accent-yellow); font-weight: bold;">₦0.00</span>
        </div>
        <input type="number" id="stakeInput" placeholder="e.g. 1000" oninput="updatePayout()">
        <button class="btn" style="width: 100%; background: var(--accent-yellow);" onclick="placeBet()">PLACE BET</button>
      </div>
    </aside>
  </div>

  <script>
    // Basic client script hook
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
    if (currentUser) {
      document.getElementById('welcomeMsg').innerText = `Hi, ${currentUser.username}`;
      document.getElementById('balanceBox').innerText = `₦${parseFloat(currentUser.balance).toLocaleString()}`;
      document.getElementById('authBtn').innerText = 'Logout';
    }

    function handleAuthAction() {
      if (currentUser) {
        localStorage.removeItem('currentUser');
        window.location.href = '/';
      } else {
        // Handle login redirection if required
        alert("Please log in using your account page.");
      }
    }

    async function handleDeposit() {
      const amount = document.getElementById('walletAmount').value;
      if (!currentUser) return alert("Please log in first.");
      if (!amount || amount <= 0) return alert("Enter a valid amount.");

      const res = await fetch('/deposit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: currentUser.id, amount: parseFloat(amount) })
      });
      const data = await res.json();
      if (res.ok) {
        alert(data.message);
        currentUser.balance = data.newBalance;
        localStorage.setItem('currentUser', JSON.stringify(currentUser));
        location.reload();
      } else {
        alert("Deposit failed.");
      }
    }

    async function handleWithdraw() {
      const amount = document.getElementById('walletAmount').value;
      if (!currentUser) return alert("Please log in first.");
      if (!amount || amount <= 0) return alert("Enter a valid amount.");

      const res = await fetch('/withdraw', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: currentUser.id, amount: parseFloat(amount) })
      });
      const data = await res.json();
      if (res.ok) {
        alert(data.message);
        currentUser.balance = data.newBalance;
        localStorage.setItem('currentUser', JSON.stringify(currentUser));
        location.reload();
      } else {
        alert(data.error || "Withdrawal failed.");
      }
    }

    function updatePayout() {
      // Placeholder calculation
    }

    function placeBet() {
      if (!currentUser) return alert("Please log in to place a bet.");
      alert("Your bet slip is empty or invalid.");
    }

    // Fetch matches on load
    async function fetchMatches() {
      try {
        const res = await fetch('/matches');
        const data = await res.json();
        const listDiv = document.getElementById('matchesList');
        listDiv.innerHTML = '';
        
        let allMatches = [...(data.upcoming || [])];
        if (allMatches.length === 0) {
          listDiv.innerHTML = '<p style="text-align:center; color:var(--text-muted);">No matches available right now.</p>';
          return;
        }

        allMatches.slice(0, 5).forEach(m => {
          const card = document.createElement('div');
          card.className = 'match-card';
          card.innerHTML = `
            <div class="match-teams">${m.home} vs ${m.away}</div>
            <div class="odds-grid">
              <button class="odd-btn">1: ${m.odds.home}</button>
              <button class="odd-btn">X: ${m.odds.draw}</button>
              <button class="odd-btn">2: ${m.odds.away}</button>
            </div>
          `;
          listDiv.appendChild(card);
        });
      } catch (e) {
        console.error('Error fetching matches:', e);
      }
    }

    fetchMatches();
  </script>
</body>
</html>
